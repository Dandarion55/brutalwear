<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

.map-card{background-color:#161616;background-image:linear-gradient(#202020 1px,transparent 1px),linear-gradient(90deg,#202020 1px,transparent 1px);background-size:40px 40px;transition:border-color .2s ease}.map-card:hover{border-color:#bc2624}

<style>html,body{margin:0;background:#0A0A0A}*,*::before,*::after{box-sizing:border-box}img,video{max-width:100%}</style>

<body>
<div id="dc-root"></div>
<template id="dc-tpl">

<a href="wardrobe.html" style="display: block; background: {{accent}}; color: #f2f2ee; text-align: center; padding: 10px 16px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none">Besplatna dostava iznad [IZNOS] · Novi drop je vani →</a>

<header style="border-bottom: 2px solid #F2F2EE">
<div class="hdr" style="max-width: 1360px; margin: 0 auto; padding: 18px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px">
<a href="index.html" style="justify-self: start; white-space: nowrap; font-family: 'Archivo Black', sans-serif; font-size: 26px; letter-spacing: -0.02em; text-decoration: none; color: #F2F2EE">BRUTAL<span style="color: {{accent}}">WEAR</span></a>
<nav aria-label="Glavna navigacija" style="display: flex; flex-wrap: wrap; gap: 28px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; width: 366px; height: 24px">
<a href="index.html" style="text-decoration: none; color: {{accent}}">Početna</a>
<a href="wardrobe.html" style="text-decoration: none">Wardrobe</a>
<a href="#novi-drop" style="text-decoration: none">Novo</a>
<a href="prijava.html" style="text-decoration: none">Prijava</a>
</nav>
<div style="justify-self: end; display: flex">
<a href="prijava.html" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; white-space: nowrap; padding: 0 16px; border: 2px solid #F2F2EE; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1.5 12h-11z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
Korpa (0)
</a>
</div>
</div>
</header>

<div style="position: relative; overflow: hidden; background: #0A0A0A">

<div aria-hidden="true" style="position: absolute; inset: 0; background: #0A0A0A; opacity: {{overlay}}; z-index: 1; pointer-events: none"></div>
<section style="max-width: 1360px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end; position: relative; z-index: 2">
<div style="flex: 999 1 560px; min-width: 0">

<div style="font-size: {{eyebrowSize}}px; font-weight: 700; letter-spacing: {{eyebrowTracking}}em; text-transform: {{eyebrowCase}}; color: {{eyebrowColor}}; margin-bottom: {{eyebrowGap}}px; white-space: pre-line">{{eyebrowText}}</div>

<div style="margin: 28px 0 0; max-width: 520px; font-size: 16px; color: #BDBDB6"><p data-path-to-node="4,0">Masivni krojevi i dugotrajan, oštar print. Otporno na pranje, imuno na prolazne trendove.</p></div>

<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="stroke: #f2f2ee"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
<a class="btn" href="prijava.html" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; background: transparent; color: #F2F2EE; border: 2px solid #F2F2EE; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Prijavi se</a>
</div>
</div>
<a class="ph hero-card" href="bazzi-feat-21-savage.html" aria-label="Pogledaj Heavy Tee" style="flex: 1 1 380px; min-width: 0; height: 520px; border: 2px solid #F2F2EE; position: relative; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden">

<div style="position: absolute; left: -2px; bottom: -2px; background: #F2F2EE; color: #0A0A0A; padding: 8px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase">HEAVY TEE ·&nbsp;320 G/M² →</div>
</a>

<hr style="margin: 0; border: none; border-top: 0.5px solid #F2F2EE">

<section style="max-width: 1360px; margin: 0 auto; padding: 96px 24px 40px">

<p style="margin: 0; max-width: 360px; color: #BDBDB6">Tri linije. Jedan stav. Izaberi svoju i uđi u ponudu.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px">
<sc-for list="{{lines}}" as="line" hint-placeholder-count="3">
<article style="border: 2px solid #F2F2EE; display: flex; flex-direction: column">
<div class="ph" style="height: 380px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #F2F2EE; position: relative">
<sc-if value="{{line.img}}" hint-placeholder-val="{{false}}">
<img src="{{line.img}}" alt="{{line.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; display: block">
</sc-if>
<sc-if value="{{line.noImg}}" hint-placeholder-val="{{true}}">
<span style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8A84">[FOTO — {{line.name}}]</span>
</sc-if>
<span style="position: absolute; top: 14px; left: 14px; font-family: 'Archivo Black', sans-serif; font-size: 48px; line-height: 1; color: {{accent}}; z-index: 1">{{line.no}}</span>
</div>
<div style="padding: 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<h3 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: 30px; text-transform: uppercase; letter-spacing: -0.02em">{{line.name}}</h3>
<p style="margin: 0; color: #BDBDB6; flex-grow: 1">{{line.desc}}</p>
<a class="btn" href="wardrobe.html" style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 20px; background: #F2F2EE; color: #0A0A0A; text-decoration: none; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase">Pogledaj Wardrobe
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>
</article>
</sc-for>
</div>
</section>

<section id="novi-drop" style="max-width: 1360px; margin: 0 auto; padding: 72px 24px; scroll-margin-top: 24px">

</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px">
<sc-for list="{{drops}}" as="p" hint-placeholder-count="4">
<a href="{{p.href}}" style="text-decoration: none; color: #F2F2EE; display: flex; flex-direction: column; gap: 12px">
<div class="ph" style="aspect-ratio: 4 / 5; border: 2px solid #F2F2EE; display: flex; align-items: center; justify-content: center; position: relative">
<sc-if value="{{p.img}}" hint-placeholder-val="{{false}}">
<img src="{{p.img}}" alt="{{p.alt}}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center; background: #FFFFFF; display: block">
</sc-if>
<sc-if value="{{p.noImg}}" hint-placeholder-val="{{true}}">
<span style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #8A8A84">[FOTO]</span>
</sc-if>
<sc-if value="{{p.isNew}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; top: 12px; left: 12px; background: {{accent}}; color: #f2f2ee; padding: 4px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">NOVO</span>
</sc-if>
</div>
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em"><span>{{p.name}}</span><span style="color: {{accent}}; white-space: nowrap">{{p.price}}</span>
</div>
<span style="font-size: 12px; color: #8A8A84; margin-top: -8px">{{p.color}}</span>
</a>
</sc-for>
</div>
</section>

<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>

</figcaption>

<svg width="56" height="56" viewBox="0 0 24 24" fill="{{accent}}" stroke="#0A0A0A" stroke-width="1" aria-hidden="true"><path d="M12 22s-7.5-6.6-7.5-12.3a7.5 7.5 0 0 1 15 0C19.5 15.4 12 22 12 22z"></path><circle cx="12" cy="9.7" r="2.6" fill="#0A0A0A"></circle></svg>

</span>

<section style="border-top: 2px solid #F2F2EE; border-bottom: 2px solid #F2F2EE; margin-top: 48px">

<div style="flex: 1 1 480px; min-width: 0">
<h2 style="margin: 0; font-family: 'Archivo Black', sans-serif; font-weight: 400; font-size: clamp(40px, 6vw, 76px); line-height: 0.9; letter-spacing: -0.03em; text-transform: uppercase">Uđi u <span style="color: {{accent}}">ekipu.</span></h2>

/* dc-lite.js — mali runtime za BrutalWear stranice.
   Čita <template id="dc-tpl">, popunjava {{rupe}}, <sc-for>, <sc-if>
   i ponovo crta stranicu kad se stanje promijeni (setState). */
(function () {
  'use strict';

  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const next = typeof patch === 'function' ? patch(this.state, this.props) : patch;
      this.state = Object.assign({}, this.state, next);
      if (this.__render) this.__render();
    }
    forceUpdate() { if (this.__render) this.__render(); }
  }
  window.DCLogic = DCLogic;

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    let v = scope;
    for (const key of path.split('.')) {
      if (v == null) return undefined;
      v = v[key];
    }
    return v;
  }

  function interp(str, scope) {
    return str.replace(HOLE, (_, p) => {
      const v = lookup(scope, p);
      return v == null ? '' : String(v);
    });
  }

  function wholePath(str) {
    const m = str && str.match(WHOLE);
    return m ? m[1] : null;
  }

  const BOOL_PROPS = { muted: 'muted', autoplay: 'autoplay', loop: 'loop', playsinline: 'playsInline', checked: 'checked', disabled: 'disabled' };

  function build(src, scope, out, refs) {
    for (const node of src.childNodes) {
      if (node.nodeType === 3) {
        out.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
        continue;
      }
      if (node.nodeType !== 1) continue;
      const tag = node.localName;

      if (tag === 'sc-for') {
        const list = lookup(scope, wholePath(node.getAttribute('list')) || '') || [];
        const as = node.getAttribute('as') || 'item';
        list.forEach((item, i) => {
          const s = Object.create(scope);
          s[as] = item;
          s.$index = i;
          build(node, s, out, refs);
        });
        continue;
      }
      if (tag === 'sc-if') {
        const p = wholePath(node.getAttribute('value'));
        if (p && lookup(scope, p)) build(node, scope, out, refs);
        continue;
      }

      const el = document.createElementNS(node.namespaceURI, node.localName);
      let selectValue = null;
      for (const attr of Array.from(node.attributes)) {
        const name = attr.name;
        const raw = attr.value;
        const wp = wholePath(raw);
        if (name.length > 2 && name.startsWith('on') && wp) {
          const fn = lookup(scope, wp);
          if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
          continue;
        }
        if (name === 'ref') {
          const fn = wp ? lookup(scope, wp) : null;
          if (typeof fn === 'function') refs.push(() => fn(el));
          continue;
        }
        if (name.startsWith('hint-')) continue;
        let value;
        if (wp) {
          value = lookup(scope, wp);
          if (value === false || value == null) continue;
          if (value === true) {
            el.setAttribute(name, '');
            if (BOOL_PROPS[name]) el[BOOL_PROPS[name]] = true;
            continue;
          }
          value = String(value);
        } else {
          value = interp(raw, scope);
        }
        if (tag === 'select' && name === 'value') { selectValue = value; continue; }
        el.setAttribute(name, value);
      }
      build(node, scope, el, refs);
      if (selectValue !== null) el.value = selectValue;
      out.appendChild(el);
    }
  }

  window.DCLite = {
    mount(Component, props) {
      const tpl = document.getElementById('dc-tpl').content;
      const root = document.getElementById('dc-root');
      const comp = new Component(props || {});
      let first = true;
      comp.__render = function () {
        // sačuvaj ono što je korisnik upisao u polja
        const saved = {};
        root.querySelectorAll('input[id], textarea[id]').forEach((f) => {
          saved[f.id] = f.type === 'checkbox' ? f.checked : f.value;
        });
        const focusedId = document.activeElement && document.activeElement.id;

        const vals = comp.renderVals() || {};
        const refs = [];
        const frag = document.createDocumentFragment();
        build(tpl, vals, frag, refs);
        root.replaceChildren(frag);

        Object.keys(saved).forEach((id) => {
          const f = document.getElementById(id);
          if (!f) return;
          if (f.type === 'checkbox') f.checked = saved[id]; else f.value = saved[id];
        });
        if (focusedId) { const f = document.getElementById(focusedId); if (f) f.focus({ preventScroll: true }); }
        refs.forEach((r) => r());

        if (first) {
          first = false;
          if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
          if (location.hash) {
            const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (t) t.scrollIntoView();
          }
        } else if (typeof comp.componentDidUpdate === 'function') {
          comp.componentDidUpdate();
        }
      };
      comp.__render();
    }
  };
})();

</script>
