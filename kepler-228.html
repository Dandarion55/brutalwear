<span style="font-size: 12px; color: #8A8A84; margin-top: -8px">{{p.line}}</span>
</a>
</sc-for>

<script>
/* dc-lite.js — mali runtime za BrutalWear stranice.
   Čita <template id="dc-tpl">, popunjava {{rupe}}, <sc-for>, <sc-if>
   i ponovo crta stranicu kad se stanje promijeni (setState). */
(function () {
  'use strict';

  class DCLogic {
    constructor(props) { this.props = props || {}; this.state = {}; }
    setState(patch) {
      const next = typeof patch === 'function' ? patch(this.state, this.props) : patch;
      this.state = Object.assign({}, this.state, next);
      if (this.__render) this.__render();
    }
    forceUpdate() { if (this.__render) this.__render(); }
  }
  window.DCLogic = DCLogic;

  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    let v = scope;
    for (const key of path.split('.')) {
      if (v == null) return undefined;
      v = v[key];
    }
    return v;
  }

  function interp(str, scope) {
    return str.replace(HOLE, (_, p) => {
      const v = lookup(scope, p);
      return v == null ? '' : String(v);
    });
  }

  function wholePath(str) {
    const m = str && str.match(WHOLE);
    return m ? m[1] : null;
  }

  const BOOL_PROPS = { muted: 'muted', autoplay: 'autoplay', loop: 'loop', playsinline: 'playsInline', checked: 'checked', disabled: 'disabled' };

  function build(src, scope, out, refs) {
    for (const node of src.childNodes) {
      if (node.nodeType === 3) {
        out.appendChild(document.createTextNode(interp(node.nodeValue, scope)));
        continue;
      }
      if (node.nodeType !== 1) continue;
      const tag = node.localName;

      if (tag === 'sc-for') {
        const list = lookup(scope, wholePath(node.getAttribute('list')) || '') || [];
        const as = node.getAttribute('as') || 'item';
        list.forEach((item, i) => {
          const s = Object.create(scope);
          s[as] = item;
          s.$index = i;
          build(node, s, out, refs);
        });
        continue;
      }
      if (tag === 'sc-if') {
        const p = wholePath(node.getAttribute('value'));
        if (p && lookup(scope, p)) build(node, scope, out, refs);
        continue;
      }

      const el = document.createElementNS(node.namespaceURI, node.localName);
      let selectValue = null;
      for (const attr of Array.from(node.attributes)) {
        const name = attr.name;
        const raw = attr.value;
        const wp = wholePath(raw);
        if (name.length > 2 && name.startsWith('on') && wp) {
          const fn = lookup(scope, wp);
          if (typeof fn === 'function') el.addEventListener(name.slice(2), fn);
          continue;
        }
        if (name === 'ref') {
          const fn = wp ? lookup(scope, wp) : null;
          if (typeof fn === 'function') refs.push(() => fn(el));
          continue;
        }
        if (name.startsWith('hint-')) continue;
        let value;
        if (wp) {
          value = lookup(scope, wp);
          if (value === false || value == null) continue;
          if (value === true) {
            el.setAttribute(name, '');
            if (BOOL_PROPS[name]) el[BOOL_PROPS[name]] = true;
            continue;
          }
          value = String(value);
        } else {
          value = interp(raw, scope);
        }
        if (tag === 'select' && name === 'value') { selectValue = value; continue; }
        el.setAttribute(name, value);
      }
      build(node, scope, el, refs);
      if (selectValue !== null) el.value = selectValue;
      out.appendChild(el);
    }
  }

  window.DCLite = {
    mount(Component, props) {
      const tpl = document.getElementById('dc-tpl').content;
      const root = document.getElementById('dc-root');
      const comp = new Component(props || {});
      let first = true;
      comp.__render = function () {
        // sačuvaj ono što je korisnik upisao u polja
        const saved = {};
        root.querySelectorAll('input[id], textarea[id]').forEach((f) => {
          saved[f.id] = f.type === 'checkbox' ? f.checked : f.value;
        });
        const focusedId = document.activeElement && document.activeElement.id;

        const vals = comp.renderVals() || {};
        const refs = [];
        const frag = document.createDocumentFragment();
        build(tpl, vals, frag, refs);
        root.replaceChildren(frag);

        Object.keys(saved).forEach((id) => {
          const f = document.getElementById(id);
          if (!f) return;
          if (f.type === 'checkbox') f.checked = saved[id]; else f.value = saved[id];
        });
        if (focusedId) { const f = document.getElementById(focusedId); if (f) f.focus({ preventScroll: true }); }
        refs.forEach((r) => r());

        if (first) {
          first = false;
          if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
          if (location.hash) {
            const t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
            if (t) t.scrollIntoView();
          }
        } else if (typeof comp.componentDidUpdate === 'function') {
          comp.componentDidUpdate();
        }
      };
      comp.__render();
    }
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: null, added: false, needSize: false, cart: 0, color: 'Crna', view: 'Proizvod', fav: false, table: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#bc2624';
    const base = 'min-height: 52px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; border: 2px solid ';
    const sizes = ['S', 'M', 'L', 'XL', 'XXL'].map((label) => {
      const on = this.state.size === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: base + (on ? accent + '; background: ' + accent + '; color: #F2F2EE' : '#F2F2EE; background: transparent; color: #F2F2EE'),
        pick: () => this.setState({ size: label, needSize: false })
      };
    });
    const colors = [
      { name: 'Crna', hex: '#0A0A0A' }
    ].map((c) => {
      const on = this.state.color === c.name;
      return {
        name: c.name,
        pressed: on ? 'true' : 'false',
        style: 'width: 44px; height: 44px; padding: 0; cursor: pointer; background: ' + c.hex + '; border: 2px solid ' + (on ? accent + '; box-shadow: inset 0 0 0 3px #0A0A0A' : '#5A5A5A'),
        pick: () => this.setState({ color: c.name, added: false })
      };
    });
    const viewList = [
      { label: 'Proizvod', img: 'assets/8cb81048eaea904ff1c1d6d913b2e0e8.png', alt: 'Kepler-228 — crna majica s leđa, s linijskom grafikom orbita i ljubičastim tekstom' },
      { label: 'Model', img: 'assets/e80b7e13c14b039afb6bac41b103a963.jpg', alt: 'Model u Kepler-228 majici, prednja strana s malim printom na grudima' },
      { label: 'Leđa', img: 'assets/5d7f15e1706c6df6712a4b48a7f1ee47.jpg', alt: 'Model s leđa u Kepler-228 majici s grafikom orbita' },
      { label: 'Detalj', img: 'assets/f96fd1b32421c9f743a5ebd081db7ef8.jpg', alt: 'Detalj printa na leđima Kepler-228 majice' }
    ];
    const curView = viewList.find((v) => v.label === this.state.view) || viewList[0];
    const views = viewList.map((v) => {
      const on = v === curView;
      return {
        label: v.label,
        img: v.img,
        pressed: on ? 'true' : 'false',
        style: 'aspect-ratio: 1 / 1; padding: 0; overflow: hidden; background: #FFFFFF; cursor: pointer; border: 2px solid ' + (on ? accent : '#3A3A3A'),
        pick: () => this.setState({ view: v.label })
      };
    });
    return {
      accent,
      sizes,
      colors,
      views,
      colorName: this.state.color,
      viewImg: curView.img,
      viewAlt: curView.alt,
      showTable: this.state.table,
      tableOpen: this.state.table ? 'true' : 'false',
      toggleTable: () => this.setState({ table: !this.state.table }),
      favPressed: this.state.fav ? 'true' : 'false',
      favColor: this.state.fav ? accent : '#F2F2EE',
      favFill: this.state.fav ? 'currentColor' : 'none',
      toggleFav: () => this.setState({ fav: !this.state.fav }),
      size: this.state.size,
      sizeLabel: this.state.size ? ' — ' + this.state.size : '',
      needSize: this.state.needSize,
      added: this.state.added,
      cartCount: this.state.cart,
      add: () => {
        if (!this.state.size) { this.setState({ needSize: true, added: false }); return; }
        this.setState({ added: true, cart: this.state.cart + 1 });
      },
      related: [
        { name: 'Bazzi feat. 21 Savage', href: 'bazzi-feat-21-savage.html', price: '45 €', line: 'Basic Heavy', isNew: true, img: 'assets/7e241726627507a5102ebfadac0380e5.png', alt: 'Isprana tamnosiva majica s plavim portretom' },
        { name: 'Cyber WMN', href: 'cyber-wmn.html', price: '30 €', line: 'Grafičke', isNew: true, img: 'assets/a5c75129b266a740dbddee596c2d7f58.png', alt: 'Crna majica s ružičastom ilustracijom djevojke s maskom' },
        { name: 'Overthinker', href: 'overthinker.html', price: '25 €', line: 'Basic Heavy', isNew: true, img: 'assets/d6148aea90118bfb6f3f515f4679f8b6.png', alt: 'Isprana crna majica s anime stripom u kvadratima' },
        { name: 'Bones', href: 'bones.html', price: '30 €', line: 'Basic Heavy', isNew: false, img: 'assets/fb0e09eb510819f0768d77430497589a.png', alt: 'Isprana crna majica s printom kostura rebara' },
        { name: 'Anime Cyber', href: 'anime-cyber.html', price: '15 €', line: 'Oversize', isNew: false, img: 'assets/589ef6173702663f819d22886186339c.png', alt: 'Crna majica s manga kadrovima na leđima' },
        { name: 'Mirror', href: 'mirror.html', price: '20 €', line: 'Oversize', isNew: false, img: 'assets/42cdabbf82ce183bcbad8c2e8d566561.png', alt: 'Isprana crna oversize majica s printom dva lica' },
        { name: 'Japan', href: 'japan.html', price: '10 €', line: 'Grafičke', isNew: false, img: 'assets/fc31e50dd719e1b8348a889c6eeb080c.png', alt: 'Crna majica s koraljno-crvenim tipografskim printom' },
        { name: 'Brutal', href: 'brutal.html', price: '10 €', line: 'Grafičke', isNew: false, img: 'assets/e08dbe6f30bd6fcb3215c15ac2b75a78.png', alt: 'Crna majica s bijelim tipografskim printom i ilustracijom lika' }
      ]
    };
  }
}
